<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Page Étudiante</title>

    <!-- Bibliothèque pour la carte -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        /* PARTIE 1 : DESIGN DU SITE */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #F7F5F0;
            color: #4B4842;
            font-family: Arial, sans-serif;
        }

        h1, h2, h3 {
            color: #4B4842;
        }

        p {
            line-height: 1.7;
        }

        /* Menu à droite */

        nav {
            position: fixed;
            top: 0;
            right: 0;
            width: 230px;
            height: 100vh;
            background-color: #E9E5DD;
            padding: 35px 20px;
        }

        nav h2 {
            font-size: 21px;
            margin-bottom: 35px;
        }

        nav button {
            display: block;
            width: 100%;
            padding: 15px 10px;
            margin-bottom: 10px;
            border: none;
            background: transparent;
            color: #4B4842;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
        }

        nav button:hover,
        nav button.actif {
            background-color: #D8D4CB;
            border-radius: 6px;
        }

        /* Contenu des onglets */

        main {
            margin-right: 230px;
            padding: 50px 7%;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .titre {
            text-align: center;
            font-size: 32px;
            margin-bottom: 15px;
        }

        .introduction {
            text-align: center;
            color: #77736B;
            margin-bottom: 35px;
        }

        /* Page d'accueil */

        .accueil {
            text-align: center;
            padding-top: 100px;
        }

        .accueil h1 {
            font-family: Georgia, serif;
            font-size: 56px;
            font-weight: normal;
        }

        .slogan {
            font-size: 23px;
            color: #77736B;
            font-style: italic;
        }

        .presentation {
            max-width: 600px;
            margin: 35px auto;
        }

        .bouton {
            background-color: #77736B;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 13px 22px;
            cursor: pointer;
        }

        /* PARTIE 2 : STYLE DE LA CARTE */

        #carte {
            height: 550px;
            width: 100%;
            border: 1px solid #D8D4CB;
            border-radius: 8px;
        }

        .point-librairie {
            width: 12px;
            height: 12px;
            background-color: #77736B;
            border: 2px solid white;
            border-radius: 50%;
        }

        .popup-librairie {
            max-width: 250px;
            line-height: 1.5;
        }

        .popup-librairie h3 {
            margin-bottom: 8px;
        }

        /* PARTIE 3 : STYLE DES LIVRES */

        .livre {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            margin-bottom: 45px;
            padding: 25px;
            background-color: #E9E5DD;
            border-radius: 8px;
        }

        .couverture {
            width: 160px;
            height: 235px;
            object-fit: cover;
            border-radius: 4px;
        }

        .avis {
            flex: 1;
        }

        .avis h3 {
            margin-top: 0;
        }

        .auteur {
            color: #77736B;
            font-style: italic;
        }

        /* Adaptation aux petits écrans */

        @media (max-width: 800px) {
            nav {
                position: relative;
                width: 100%;
                height: auto;
            }

            main {
                margin-right: 0;
                padding: 25px;
            }

            .accueil {
                padding-top: 40px;
            }

            .accueil h1 {
                font-size: 38px;
            }

            .livre {
                flex-direction: column;
            }

            #carte {
                height: 450px;
            }
        }
    </style>
</head>

<body>

    <!-- MENU DU SITE -->

    <nav>
        <h2>Ma Page Étudiante</h2>

        <button class="actif"
                onclick="ouvrirSection('accueil', this)">
            Accueil
        </button>

        <button onclick="ouvrirSection('librairies', this)">
            Les librairies conçues pour vous
        </button>

        <button onclick="ouvrirSection('coups', this)">
            Nos coups de cœur
        </button>

        <button onclick="ouvrirSection('conseils', this)">
            Conseils pratiques
        </button>
    </nav>

    <main>

        <!-- PAGE D'ACCUEIL -->

        <section id="accueil" class="section active">

            <div class="accueil">
                <h1>Ma Page Étudiante</h1>

                <p class="slogan">
                    Plus de culture, moins de dépenses !
                </p>

                <p class="presentation">
                    Découvrez les librairies parisiennes
                    accessibles aux étudiants, des livres
                    à petits prix et nos recommandations
                    littéraires.
                </p>

                <button class="bouton"
                        onclick="ouvrirSection('librairies')">
                    Découvrir les librairies
                </button>
            </div>

        </section>
